<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 扁平圆角方背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#2563eb"/>
  <!-- dot：呼应 .md 的“点” -->
  <circle cx="256" cy="130" r="34" fill="#ffffff"/>
  <!-- down：双下箭头，呼应 markDOWN -->
  <g fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="150,216 256,316 362,216"/>
    <polyline points="150,306 256,406 362,306"/>
  </g>
</svg>
